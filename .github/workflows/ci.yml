name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
      - run: uv sync --locked --extra live
      - run: uv run --locked --extra live ruff check .
      - run: uv run --locked --extra live ruff format --check .
      - run: uv run --locked --extra live pytest
      - run: node --test tests/operator_ui.test.cjs
      - run: uv run --locked --extra live incident-demo validate-corpus
      - run: uv run --locked --extra live incident-demo schemas --check
  infrastructure:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
      - run: uv run --locked python manage.py synth
