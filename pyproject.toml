[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aws-incident-response-demo"
version = "0.1.0"
description = "Synthetic incident response contracts and offline fixtures"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph==1.2.12",
    "pydantic==2.12.3",
]

[project.scripts]
incident-demo = "incident_demo.cli:main"

[project.optional-dependencies]
live = [
    "boto3[crt]==1.43.108",
    "langchain-aws==1.8.0",
    "numpy==2.2.6",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/incident_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
